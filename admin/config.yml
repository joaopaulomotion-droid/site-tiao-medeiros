backend:
  name: git-gateway
  branch: main

media_folder: "img/uploads"
public_folder: "/img/uploads"

locale: "pt"

collections:
  - name: "pautas"
    label: "🟦 Pautas e Valores"
    description: "Os 4 cards que aparecem na secao 'Pautas e Valores' do site, e o conteudo que abre ao clicar em cada um."
    files:
      - name: "pautas"
        label: "As 4 pautas"
        file: "_data/pautas.json"
        fields:
          - label: "Pautas"
            name: "pautas"
            widget: "list"
            minimize: false
            summary: "{{title}}"
            fields:
              - { label: "Identificador (nao alterar)", name: "id", widget: "string" }
              - label: "Icone"
                name: "icon"
                widget: "select"
                options: ["agro", "familia", "empreendedorismo", "seguranca"]
              - { label: "Titulo do card", name: "title", widget: "string" }
              - { label: "Resumo curto (aparece no card)", name: "summary", widget: "text" }
              - { label: "Foto (aparece ao clicar / abrir)", name: "photo", widget: "image", required: false }
              - { label: "Texto completo (aparece ao abrir)", name: "body", widget: "list", field: { label: "Paragrafo", name: "paragraph", widget: "text" } }

  - name: "timeline"
    label: "🟦 Trajetoria"
    description: "Os 9 momentos que aparecem na linha do tempo horizontal do site."
    files:
      - name: "timeline"
        label: "Os 9 momentos"
        file: "_data/timeline.json"
        fields:
          - label: "Momentos"
            name: "timeline"
            widget: "list"
            minimize: false
            summary: "{{num}} - {{title}}"
            fields:
              - { label: "Numero (01, 02, 03...)", name: "num", widget: "string" }
              - { label: "Titulo do momento", name: "title", widget: "string" }
              - { label: "Foto deste momento", name: "photo", widget: "image", required: false }
              - { label: "Texto completo (aparece ao clicar)", name: "body", widget: "list", field: { label: "Paragrafo", name: "paragraph", widget: "text" } }

  - name: "projetos"
    label: "🟦 Projetos Legislativos"
    description: "Os cards de projetos de lei que aparecem na secao 'Projetos legislativos'."
    files:
      - name: "projetos"
        label: "Lista de projetos"
        file: "_data/projetos.json"
        fields:
          - label: "Projetos"
            name: "projetos"
            widget: "list"
            minimize: false
            summary: "{{tag}} - {{title}}"
            fields:
              - { label: "Numero do projeto (ex: PL 4497/24)", name: "tag", widget: "string" }
              - { label: "Titulo do projeto", name: "title", widget: "string" }
              - { label: "Descricao", name: "body", widget: "text" }
              - { label: "Tiao Medeiros foi o Relator?", name: "relator", widget: "boolean", default: false }
              - { label: "Link da materia/pagina que explica o projeto", name: "link", widget: "string", hint: "Cole aqui o link de uma noticia, materia ou pagina que fala sobre este projeto" }
              - { label: "Card largo (ocupa a linha toda)", name: "wide", widget: "boolean", default: false }

  - name: "hero"
    label: "⬜ Inicio - Topo do site"
    description: "O primeiro bloco que a pessoa ve ao abrir o site: titulo, texto, botoes e foto principal."
    files:
      - name: "hero"
        label: "Topo do site (Inicio)"
        file: "_data/hero.json"
        fields:
          - { label: "Selo acima do titulo", name: "eyebrow", widget: "string" }
          - { label: "Titulo principal (pode usar <em>destaque</em> para grifar em amarelo)", name: "title_html", widget: "string" }
          - { label: "Texto de apoio abaixo do titulo", name: "lead", widget: "text" }
          - { label: "Botao principal - texto", name: "cta_primary_label", widget: "string" }
          - { label: "Botao principal - link", name: "cta_primary_href", widget: "string" }
          - { label: "Botao secundario - texto", name: "cta_secondary_label", widget: "string" }
          - { label: "Botao secundario - link", name: "cta_secondary_href", widget: "string" }
          - { label: "Texto pequeno de confianca", name: "trust_text", widget: "string" }
          - { label: "Texto pequeno em negrito", name: "trust_strong", widget: "string" }
          - { label: "Selo do Indice Legisla Brasil", name: "legisla_chip", widget: "string" }
          - { label: "Foto principal", name: "photo", widget: "image", required: false }
          - { label: "Selo - numero (ex: +10 anos)", name: "photo_note_number", widget: "string" }
          - { label: "Selo - texto", name: "photo_note_text", widget: "string" }

  - name: "about"
    label: "⬜ Sobre - Quem e Tiao Medeiros"
    description: "A secao 'Sobre', com a biografia e a foto ao lado."
    files:
      - name: "about"
        label: "Secao Sobre"
        file: "_data/about.json"
        fields:
          - { label: "Selo acima do titulo", name: "eyebrow", widget: "string" }
          - { label: "Titulo da secao", name: "title", widget: "string" }
          - { label: "Foto", name: "photo", widget: "image", required: false }
          - { label: "Paragrafos do texto", name: "paragraphs", widget: "list", field: { label: "Paragrafo", name: "paragraph", widget: "text" } }
          - { label: "Selos (ex: Advogado)", name: "badges", widget: "list", field: { label: "Selo", name: "badge", widget: "string" } }

  - name: "reconhecimento"
    label: "⬜ Reconhecimento"
    description: "O bloco azul com a medalha do Indice Legisla Brasil."
    files:
      - name: "reconhecimento"
        label: "Bloco de Reconhecimento"
        file: "_data/reconhecimento.json"
        fields:
          - { label: "Numero na medalha", name: "medal_big", widget: "string" }
          - { label: "Texto pequeno na medalha", name: "medal_small", widget: "string" }
          - { label: "Titulo", name: "title", widget: "string" }
          - { label: "Texto", name: "text", widget: "text" }
          - { label: "Foto de fundo (opcional)", name: "photo", widget: "image", required: false }
          - label: "Enquadramento da foto (ajuste se o rosto for cortado)"
            name: "photo_position"
            widget: "select"
            default: "center"
            options: [{ label: "Mostrar topo da foto (rosto)", value: "top" }, { label: "Mostrar meio da foto", value: "center" }, { label: "Mostrar base da foto", value: "bottom" }]
          - { label: "Link da materia (opcional)", name: "link", widget: "string", required: false, hint: "Cole aqui o link de uma noticia ou materia sobre o Indice Legisla Brasil" }

  - name: "video"
    label: "⬜ Video institucional"
    description: "O video do YouTube que aparece perto do final do site."
    files:
      - name: "video"
        label: "Video"
        file: "_data/video.json"
        fields:
          - { label: "ID do video no YouTube (a parte depois de watch?v=)", name: "youtube_id", widget: "string", required: false, hint: "Deixe em branco para mostrar o botao de play sem video ainda" }
          - { label: "Texto mostrado quando nao ha video", name: "placeholder_text", widget: "string" }

  - name: "footer"
    label: "⬜ Rodape e Contato"
    description: "As informacoes de contato e redes sociais no rodape do site."
    files:
      - name: "footer"
        label: "Rodape"
        file: "_data/footer.json"
        fields:
          - { label: "Texto sobre o mandato", name: "about_text", widget: "text" }
          - { label: "Endereco do gabinete", name: "endereco", widget: "string" }
          - { label: "Telefone", name: "telefone", widget: "string" }
          - { label: "E-mail", name: "email", widget: "string" }
          - { label: "Link Instagram", name: "instagram_url", widget: "string", required: false }
          - { label: "Link Facebook", name: "facebook_url", widget: "string", required: false }
          - { label: "Link YouTube", name: "youtube_url", widget: "string", required: false }
          - { label: "Link WhatsApp", name: "whatsapp_url", widget: "string", required: false }
          - label: "Link do grupo do WhatsApp"
            name: "whatsapp_group_url"
            widget: "string"
            required: false
            hint: "Cole aqui o link de convite do grupo do WhatsApp. Vai ser usado no botao 'Entre no grupo do WhatsApp' do menu"
          - { label: "Linha de copyright", name: "copyright", widget: "string" }
          - { label: "Linha de cargo", name: "cargo_line", widget: "string" }

  - name: "meta"
    label: "⬜ SEO (Google)"
    description: "Titulo e descricao usados pelo Google e ao compartilhar o link nas redes."
    files:
      - name: "meta"
        label: "SEO"
        file: "_data/meta.json"
        fields:
          - { label: "Titulo da pagina", name: "title", widget: "string" }
          - { label: "Descricao da pagina", name: "description", widget: "text" }
          - { label: "Endereco oficial do site (nao alterar)", name: "url", widget: "string" }
          - { label: "Foto ao compartilhar o link (WhatsApp e redes)", name: "og_image", widget: "image" }
